version: '3.8'

services:
  db:
    image: postgres:15
    container_name: quotes_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quotes_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: quotes_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG}
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data: