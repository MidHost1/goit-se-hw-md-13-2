{% if validlink %}
    <h2>Enter new password</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save new password</button>
    </form>
{% else %}
    <h2>This link is invalid or has already been used</h2>
    <p><a href="{% url 'quotes:password_reset' %}">Request a new one</a></p>
{% endif %}
